        function getSupportedDRMSystems() {
            if (typeof navigator.requestMediaKeySystemAccess === 'function') {
                const supportedConfig = [{
                    initDataTypes: ['cenc'],
                    videoCapabilities: [{
                        contentType: 'video/mp4;codecs="avc1.42E01E"'
                    }],
                }];
                const drmSystems = [
                    // 'org.w3.clearkey',
                    // 'com.widevine.alpha',
                    'com.microsoft.playready',
                    'com.apple.fps',
                    'com.apple.fps.1_0',
                    // 'com.adobe.primetime'
                    // Add more DRM system identifiers as needed
                ];
                const supportedDRM = [];
                // Use Promise.all to check support for each DRM system
                return Promise.all(drmSystems.map(drmSystem => {
                    return navigator.requestMediaKeySystemAccess(drmSystem, supportedConfig)
                        .then(() => {
                            supportedDRM.push(drmSystem);
                        })
                        .catch(error => {
                            //DRM system is not supported, do nothing
                        });
                })).then(() => {
                    return supportedDRM; // Return the list of supported DRM systems
                });
            } else {
                // EME is not supported
                return Promise.resolve([]);
            }
        }

        function parsingResponse(response) {
            let responseText = arrayBufferToString(response.data);
            // Trim whitespace.
            responseText = responseText.trim();

            console.log('responseText :: ', responseText);

            try {
                const pallyconObj = JSON.parse(responseText);
                if (pallyconObj && pallyconObj.errorCode && pallyconObj.message) {
                    if ("8002" != errorCode) {
                        alert("PallyCon Error : " + pallyconObj.message + "(" + pallyconObj.errorCode + ")");
                        //window.alert('No Rights. Server Response ' + responseText);
                    } else {
                        var errorObj = JSON.parse(pallyconObj.message);
                        alert("Error : " + errorObj.MESSAGE + "(" + errorObj.ERROR + ")");
                    }
                }
            } catch (e) {}
        }

        function arrayToString(array) {
            var uint16array = new Uint16Array(array.buffer);
            return String.fromCharCode.apply(null, uint16array);
        }

        function arrayBufferToString(buffer) {
            var arr = new Uint8Array(buffer);
            var str = String.fromCharCode.apply(String, arr);
            // if(/[\u0080-\uffff]/.test(str)){
            //     throw new Error("this string seems to contain (still encoded) multibytes");
            // }
            return str;
        }

        function base64DecodeUint8Array(input) {
            var raw = window.atob(input);
            var rawLength = raw.length;
            var array = new Uint8Array(new ArrayBuffer(rawLength));

            for (i = 0; i < rawLength; i++)
                array[i] = raw.charCodeAt(i);

            return array;
        }

        function base64EncodeUint8Array(input) {
            var keyStr = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            var output = "";
            var chr1, chr2, chr3, enc1, enc2, enc3, enc4;
            var i = 0;

            while (i < input.length) {
                chr1 = input[i++];
                chr2 = i < input.length ? input[i++] : Number.NaN;
                chr3 = i < input.length ? input[i++] : Number.NaN;

                enc1 = chr1 >> 2;
                enc2 = ((chr1 & 3) << 4) | (chr2 >> 4);
                enc3 = ((chr2 & 15) << 2) | (chr3 >> 6);
                enc4 = chr3 & 63;

                if (isNaN(chr2)) {
                    enc3 = enc4 = 64;
                } else if (isNaN(chr3)) {
                    enc4 = 64;
                }
                output += keyStr.charAt(enc1) + keyStr.charAt(enc2) +
                    keyStr.charAt(enc3) + keyStr.charAt(enc4);
            }
            return output;
        }
